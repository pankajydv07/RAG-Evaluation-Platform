[project]
name = "ragapp"
version = "0.1.0"
description = "Production RAG System and Evaluation Platform with Supabase, Groq, and Nebius AI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "supabase>=2.7.0",
    "httpx>=0.27.0",
    "groq>=0.11.0",
    "openai>=1.40.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.3.0",
    "beautifulsoup4>=4.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.1.14",
    "datasets>=2.20.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
