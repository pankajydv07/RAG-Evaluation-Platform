services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ragapp-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ragapp_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ragapp
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ragapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragapp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ragapp-network

volumes:
  postgres_data:
  backend_data:

networks:
  ragapp-network:
    driver: bridge
